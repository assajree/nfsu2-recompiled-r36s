# NFSU2 settings, read by NFSU2.sh at launch.
# Graphics: potato_1 | potato_2 | potato_3 | performance | balanced | quality
NFSU2_GRAPHICS=performance
# Frame cap: 15..240 (e.g. 30 or 60; 0 = uncapped)
NFSU2_FPS=30
# Language: Spanish | English | French | German | Italian | Thai
NFSU2_LANG=Spanish
# Subtitles (v10): 1 = on (all languages), 0 = off, unset/empty = auto (on for Thai)
# NFSU2_SUBTITLES=1
# Extra game options, e.g. "g_CrowdEnable=0;g_FogEnable=0"
NFSU2_REGISTRY_EXTRA=""
# Draw distance in metres: scenery wholly beyond it is skipped and the fog is opaque there,
# so nothing pops. Lower = faster but foggier; 0 = the game's own distance.
NFSU2_DRAW_DIST=200
# Optional Potato Mode / dynamic draw budget (0 = off / preset default):
# Potato level override (0 = off, 1 = lowest LOD, 2 = PS1 Nearest 32px, 3 = Witcher Clay 8px)
# NFSU2_POTATO=0
# Target max scenery items/frame (0 = off/fixed dist, e.g. 260..420)
# NFSU2_DRAW_BUDGET=0
# Optional trade-off toggles (0 = off / profile default):
# Car reflection map update divider while driving (0 = full rate, 2 = half rate, 3 = 1/3 rate)
NFSU2_HALF_REFLECT=0
# Override car reflections / headlights / crowd / particles on top of any graphics preset (0 or 1; leave empty for preset default)
# NFSU2_CAR_REFLECT=0
# NFSU2_HEADLIGHTS=1
# NFSU2_CROWD=0
# NFSU2_PARTICLES=0
# Distant AI car physics/controller throttling (0 = off, 2 = 1/2 rate, 3 = 1/3 rate beyond DIST metres)
NFSU2_DISTANT_AI_RATE=0
NFSU2_DISTANT_AI_DIST=45
# Fast Boot: 1 = skip intro movies (EA/THX/Opening/PSA) in runtime without renaming files; 0 = normal
# NFSU2_SKIP_INTRO=1
# Title Screen 30s Attract Mode: auto = disable when FMVOpening.vp6 is missing or skipped; 0 = always off; 1 = always on
# NFSU2_ATTRACT_MODE=auto
